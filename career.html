<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WRL Career Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152333; --navy-d:#0d1620; --navy-l:#1e3347;
  --orange:#ff7030; --cream:#fdf8e5;
  --c80:rgba(253,248,229,.80); --c50:rgba(253,248,229,.50); --c30:rgba(253,248,229,.30);
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --cw:#4a90e2; --ssb:#ff7030; --fm:#9b59b6; --dig:#2ecc71; --gold:#E0A52E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;height:100%}
#fit{position:absolute;top:0;left:0;transform-origin:top left}
#board{
  width:1080px;height:1920px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--navy-d) 0%,var(--navy) 45%,var(--navy-l) 100%);
  color:var(--cream);font-family:'Source Sans Pro',sans-serif;
  padding:36px 40px;display:flex;flex-direction:column;gap:20px;
}
#board::before,#board::after{
  content:'';position:absolute;width:640px;height:640px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,112,48,.13) 0%,rgba(255,112,48,0) 70%);
}
#board::before{top:-260px;left:-240px}
#board::after{bottom:-280px;right:-260px}
.z{position:relative;z-index:2}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--orange);padding-bottom:16px}
.call{font-family:'Oswald',sans-serif;font-weight:700;font-size:74px;line-height:.9;letter-spacing:1px}
.sub{font-family:'Oswald',sans-serif;font-weight:400;font-size:20px;letter-spacing:5px;text-transform:uppercase;color:var(--orange);margin-top:8px}
.hdr-r{text-align:right}
.hdr-r .t{font-family:'Oswald',sans-serif;font-size:46px;font-weight:300;line-height:1}
.hdr-r .d{font-size:17px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c50);margin-top:6px}

.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.hero .big{font-family:'Oswald',sans-serif;font-weight:300;font-size:128px;line-height:.82;letter-spacing:-2px}
.hero .lbl{font-size:16px;letter-spacing:4px;text-transform:uppercase;color:var(--c50);margin-top:10px}
.since{text-align:right;font-size:17px;color:var(--c80);line-height:1.7}
.since b{font-family:'Oswald',sans-serif;font-weight:500;font-size:30px;color:var(--orange);display:block;line-height:1.1}

.sh{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.sh span{font-family:'Oswald',sans-serif;font-size:19px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--orange);white-space:nowrap}
.sh i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,112,48,.55),rgba(255,112,48,0))}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
.stat .n{font-family:'Oswald',sans-serif;font-weight:400;font-size:56px;line-height:1}
.stat .n small{font-size:24px;color:var(--c50);font-weight:300}
.stat .l{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c50);margin-top:6px}
.stat.odo .n{color:var(--gold)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}

.mbar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:16px}
.mleg{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.mleg div{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--c80)}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.mleg b{margin-left:auto;font-family:'Oswald',sans-serif;font-weight:400;color:var(--cream)}

/* furthest-contacts ladder */
#dx .dxr{display:grid;grid-template-columns:28px 128px 1fr 104px 116px 128px;
  align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#dx .dxr:last-child{border-bottom:none;padding-bottom:0}
#dx .rk{font-family:'Oswald',sans-serif;font-size:17px;color:var(--c50);text-align:right}
#dx .cs{font-family:'Oswald',sans-serif;font-size:23px;letter-spacing:.5px}
#dx .co{font-size:16px;color:var(--c80);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dx .bm,#dx .dt{font-size:15px;color:var(--c50);text-align:right;white-space:nowrap}
#dx .mi{font-family:'Oswald',sans-serif;font-size:23px;color:var(--gold);text-align:right}
#dx .mi em{font-style:normal;font-size:14px;color:var(--c50);margin-left:5px}
#dx .top .cs{color:var(--gold)}

/* month-by-month activity */
.mos{display:flex;align-items:flex-end;gap:3px;height:172px}
.mo{flex:1;background:rgba(255,112,48,.34);border-radius:3px 3px 0 0;min-height:2px}
.mo.jan{background:rgba(255,112,48,.52)}
.mo.cur{background:var(--orange)}
#mlab{display:flex;gap:3px;margin-top:7px;height:16px}
#mlab .ml{flex:1;position:relative}
#mlab .ml span{position:absolute;left:50%;transform:translateX(-50%);
  font-family:'Oswald',sans-serif;font-size:14px;color:var(--c50);white-space:nowrap}

.rec{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.rec:last-child{border-bottom:none;padding-bottom:0}
.rec .k{font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c50)}
.rec .v{font-family:'Oswald',sans-serif;font-size:28px;font-weight:500}
.rec .v em{font-style:normal;font-size:16px;color:var(--c50);margin-left:8px;font-weight:300}
.gold{color:var(--gold)}

.yrs{display:flex;align-items:stretch;gap:14px;height:282px;padding-top:4px}
.yr{flex:1;display:flex;flex-direction:column;align-items:center}
.yr .tk{position:relative;width:100%;flex:1}
.yr .b,.yr .pc{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 0 0}
.yr .b{background:rgba(255,112,48,.35)}
.yr.now .b{background:var(--orange)}
/* Dashed, because a projection is not a measurement. */
.yr .pc{border:2px dashed rgba(255,112,48,.45);border-bottom:none;background:rgba(255,112,48,.05)}
.yr .y{font-family:'Oswald',sans-serif;font-size:17px;color:var(--c50);margin-top:9px}
.yr .c{font-family:'Oswald',sans-serif;font-size:18px;color:var(--c80);margin-bottom:7px;white-space:nowrap}
.yr .c em{font-style:normal;font-size:15px;color:var(--orange);margin-left:6px}

.ftr{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c30);
  border-top:1px solid var(--line);padding-top:14px}
/* ---- appended: stale indicator only. Nothing above this line is changed. ---- */
.ftr .stale{color:var(--orange);opacity:0;transition:opacity .4s}
.ftr .stale.on{opacity:1}
</style>
</head>
<body>
<div id="fit"><div id="board">

  <div class="hdr z">
    <div>
      <div class="call">K8JKU</div>
      <div class="sub">Station log &middot; career</div>
    </div>
    <div class="hdr-r">
      <div class="t"><span id="clock">--:--</span><span style="font-size:22px;color:var(--c50)"> UTC</span></div>
      <div class="d" id="today">&nbsp;</div>
    </div>
  </div>

  <div class="hero z">
    <div>
      <div class="big" id="total">&mdash;</div>
      <div class="lbl">Contacts logged</div>
    </div>
    <div class="since">
      <b id="thisYear">&mdash;</b> logged this year<br>
      <span style="color:var(--c50)" id="firstQso">&nbsp;</span>
    </div>
  </div>

  <div class="z">
    <div class="sh"><span>Reach</span><i></i></div>
    <div class="stats">
      <div class="stat"><div class="n" id="dxcc">&mdash;</div><div class="l">DXCC</div></div>
      <div class="stat"><div class="n" id="gridsN">&mdash;</div><div class="l">Grids</div></div>
      <div class="stat"><div class="n" id="conts">&mdash;</div><div class="l">Continents</div></div>
      <div class="stat odo"><div class="n" id="miles">&mdash;</div><div class="l">Miles worked</div></div>
    </div>
  </div>

  <div class="cols z">
    <div class="panel">
      <div class="sh"><span>Modes</span><i></i></div>
      <div class="mbar" id="mbar"></div>
      <div class="mleg" id="mleg"></div>
    </div>

    <div class="panel">
      <div class="sh"><span>Records</span><i></i></div>
      <div id="records"></div>
    </div>
  </div>

  <div class="z" id="dxBlock">
    <div class="sh"><span>Furthest contacts &middot; one row per station</span><i></i></div>
    <div id="dx"></div>
  </div>

  <div class="z" id="moBlock">
    <div class="sh"><span>Month by month</span><i></i></div>
    <div class="mos" id="months"></div>
    <div id="mlab"></div>
  </div>

  <div class="z">
    <div class="sh"><span>Contacts by year</span><i></i></div>
    <div class="yrs" id="years"></div>
  </div>

  <div class="ftr z">
    <div>World Radio League &middot; home + POTA</div>
    <div><span class="stale" id="stale">Stale &middot; </span><span id="synced">&nbsp;</span></div>
  </div>

</div></div>
<script>
/* ------------------------------------------------------------------ tuning */
var AUTO_FIT   = true;    // scale the 1080x1920 board to fill the viewport
var ROTATE     = 0;       // 0 | 90 | 180 | 270. Use only when the browser's
                          // viewport orientation does not match the panel's
                          // physical orientation. Verified in Chromium:
                          // 90 puts the board's TOP EDGE on the RIGHT of the
                          // viewport, 270 puts it on the LEFT. If the display
                          // comes out upside down, use the other one.
var DATA_URL   = 'data/latest/career.json';
var TICK_MS    = 1000;           // master tick: clock + fetch scheduling
var REFRESH_MS = 10 * 60 * 1000; // career data changes nightly
var STALE_AFTER = 3;             // consecutive failures before the badge
var MAX_MODES  = 10;             // mode legend entries; the log has 9
var MAX_DX     = 8;              // rows in the furthest-contacts ladder
// Days into the year before a year-end projection means anything. Two weeks of
// January is not a trend, and an early bad week would libel the whole year.
var PACE_MIN_DAYS = 45;
var CAT_COLOR  = {cw:'#4a90e2', ssb:'#ff7030', fm:'#9b59b6', dig:'#2ecc71'};
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ------------------------------------------------------------------- fit */
function fit(){
  var f = document.getElementById('fit');
  if(!f) return;

  // Footprint after rotation: at 90/270 the board's width and height swap.
  var swap = (ROTATE === 90 || ROTATE === 270);
  var bw = swap ? 1920 : 1080;
  var bh = swap ? 1080 : 1920;

  var s = AUTO_FIT ? Math.min(innerWidth/bw, innerHeight/bh) : 1;

  // Centre on both axes. The old version only centred horizontally, which
  // left the board hugging the top of any viewport taller than the board.
  var left = (innerWidth  - bw*s)/2;
  var top  = (innerHeight - bh*s)/2;

  // Rotation happens about the top-left origin, so the board swings out of
  // view; translate it back by its own rotated footprint before centring.
  var tx = left, ty = top, rot = '';
  if(ROTATE === 90)       { tx += bw*s;             rot = ' rotate(90deg)'; }
  else if(ROTATE === 180) { tx += bw*s; ty += bh*s; rot = ' rotate(180deg)'; }
  else if(ROTATE === 270) {             ty += bh*s; rot = ' rotate(270deg)'; }

  f.style.left = '0';
  f.style.top  = '0';
  f.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+s+')'+rot;
}
addEventListener('resize', fit); fit();

/* --------------------------------------------------------------- helpers */
function $(id){ return document.getElementById(id); }
function num(n){ return (n==null) ? '—' : n.toLocaleString('en-US'); }
function pad(n){ return (n<10?'0':'')+n; }

// 8,299,309 -> {v:'8.3', u:'M'}; the odometer tile keeps its small suffix.
function odometer(mi){
  if(mi==null) return {v:'—', u:''};
  if(mi >= 1e6) return {v:(mi/1e6).toFixed(1), u:'M'};
  if(mi >= 1e3) return {v:(mi/1e3).toFixed(0), u:'K'};
  return {v:String(mi), u:''};
}
function fmtDate(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return '';
  return pad(+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0];
}
// '2024-08' -> 'Aug 2024'
function fmtMonth(m){
  var p = String(m||'').split('-');
  if(p.length < 2) return '';
  return MONTHS[+p[1]-1]+' '+p[0];
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ----------------------------------------------------------------- state */
var lastSig = null;      // payload signature; guards against needless rebuilds
var lastGood = null;     // last payload that rendered, kept across failures
var failures = 0;
var ticks = 0;

/* --------------------------------------------------------------- rendering */
function renderHeader(){
  var d = new Date();
  $('clock').textContent = pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
  $('today').textContent = DAYS[d.getUTCDay()]+' '+pad(d.getUTCDate())+' '
                         + MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear();
}

// Both new blocks hide rather than render an empty header. career.json only
// grows these fields on the next FULL collector run, and until then a bare
// section heading over nothing reads as a broken board.
function show(id, on){ $(id).style.display = on ? '' : 'none'; }

function renderDx(rows){
  rows = (rows||[]).slice(0, MAX_DX);
  show('dxBlock', rows.length > 0);
  if(!rows.length){ $('dx').innerHTML = ''; return; }
  $('dx').innerHTML = rows.map(function(d, i){
    var bm = [d.band, d.mode].filter(Boolean).join(' \u00b7 ');
    return '<div class="dxr'+(i===0?' top':'')+'">'
         + '<div class="rk">'+(i+1)+'</div>'
         + '<div class="cs">'+esc(d.call)+'</div>'
         + '<div class="co">'+esc(d.country||'')+'</div>'
         + '<div class="bm">'+esc(bm)+'</div>'
         + '<div class="dt">'+fmtDate(d.date)+'</div>'
         + '<div class="mi">'+num(d.miles)+'<em>mi</em></div>'
         + '</div>';
  }).join('');
}

function renderMonths(months){
  months = months || [];
  show('moBlock', months.length > 0);
  if(!months.length){ $('months').innerHTML = $('mlab').innerHTML = ''; return; }
  var max = months.reduce(function(m,x){ return Math.max(m, x.count); }, 0) || 1;
  var cur = months.length ? months[months.length-1].month : null;
  var bars = '', labs = '';
  months.forEach(function(x, i){
    var jan = x.month.slice(5) === '01';
    var cls = 'mo' + (x.month === cur ? ' cur' : (jan ? ' jan' : ''));
    // An empty month keeps its slot and collapses to the 2px floor in CSS:
    // a gap has to look like a gap, not like a month that never existed.
    var h = x.count ? Math.max(3, 100*x.count/max) : 0;
    bars += '<div class="'+cls+'" style="height:'+h.toFixed(1)+'%"></div>';
    // Label every January, plus the first month, which is rarely a January.
    labs += '<div class="ml">'
          + ((jan || i===0) ? '<span>'+x.month.slice(0,4)+'</span>' : '')
          + '</div>';
  });
  $('months').innerHTML = bars;
  $('mlab').innerHTML = labs;
}

function renderModes(groups, modes){
  var g = (groups||[]).filter(function(x){ return x.count > 0; });
  var tot = g.reduce(function(s,x){ return s+x.count; }, 0) || 1;
  $('mbar').innerHTML = g.map(function(x){
    return '<div style="width:'+(100*x.count/tot).toFixed(2)+'%;background:'
         + (CAT_COLOR[x.category]||CAT_COLOR.dig)+'"></div>';
  }).join('');

  $('mleg').innerHTML = (modes||[]).slice(0, MAX_MODES).map(function(m){
    return '<div><i class="dot" style="background:'+(CAT_COLOR[m.category]||CAT_COLOR.dig)
         + '"></i>'+esc(m.mode)+'<b>'+num(m.count)+'</b></div>';
  }).join('');
}

function rec(label, value, note, gold){
  return '<div class="rec"><div class="k">'+label+'</div>'
       + '<div class="v'+(gold?' gold':'')+'">'+value
       + (note ? '<em>'+note+'</em>' : '')+'</div></div>';
}

function renderRecords(r){
  r = r || {};
  var h = '';
  // Furthest is deliberately absent: it is row 1 of the ladder below, with the
  // country, band and date the one-line record could never fit.
  if(r.best_day){
    h += rec('Best day', num(r.best_day.count),
             'QSOs &middot; '+fmtDate(r.best_day.date), true);
  }
  h += rec('Longest streak', num(r.longest_streak), 'days', false);
  if(r.active_days != null){
    h += rec('Days on the air', num(r.active_days), 'days', false);
  }
  if(r.busiest_month){
    h += rec('Busiest month', num(r.busiest_month.count),
             'QSOs &middot; '+fmtMonth(r.busiest_month.month), true);
  }
  $('records').innerHTML = h;
}

// Year-end projection for the year in progress, so a partial year is not read
// as a collapse every January. Straight-line on the year so far; it makes no
// attempt to model season, which is why it is drawn dashed and labelled.
function paceFor(years, curYear){
  var cur = years.filter(function(y){ return y.year === curYear; })[0];
  if(!cur || !cur.count) return null;
  var elapsed = (Date.now() - Date.UTC(curYear,0,1)) / 86400000;
  if(elapsed < PACE_MIN_DAYS) return null;
  var len = ((curYear%4===0 && curYear%100!==0) || curYear%400===0) ? 366 : 365;
  return Math.round(cur.count / elapsed * len);
}

function renderYears(years){
  years = years || [];
  var curYear = new Date().getUTCFullYear();
  var pace = paceFor(years, curYear);

  // The projection scales the axis too, or the ghost would clip at the top.
  var max = years.reduce(function(m,y){ return Math.max(m, y.count); }, 0);
  max = Math.max(max, pace || 0) || 1;

  $('years').innerHTML = years.map(function(y){
    var isNow = y.year === curYear;
    var ghost = (isNow && pace && pace > y.count)
      ? '<div class="pc" style="height:'+(100*pace/max).toFixed(1)+'%"></div>' : '';
    return '<div class="yr'+(isNow?' now':'')+'">'
         + '<div class="c">'+num(y.count)
         + (ghost ? '<em>&rarr; '+num(pace)+'</em>' : '')+'</div>'
         + '<div class="tk">'+ghost
         + '<div class="b" style="height:'+Math.max(1,100*y.count/max).toFixed(1)+'%"></div>'
         + '</div>'
         + '<div class="y">'+y.year+'</div></div>';
  }).join('');
}

function render(d){
  $('total').textContent    = num(d.total_qsos);
  $('thisYear').textContent = num(d.qsos_this_year);
  $('firstQso').textContent = d.first_qso_date ? 'First QSO '+fmtDate(d.first_qso_date) : '';
  $('dxcc').textContent     = num(d.dxcc_count);
  $('gridsN').textContent   = num(d.grid_count);
  $('conts').innerHTML      = num(d.continent_count)
                            + '<small>/'+(d.continent_total||6)+'</small>';
  var o = odometer(d.total_distance);
  $('miles').innerHTML      = o.v + (o.u ? '<small>'+o.u+'</small>' : '');

  renderModes(d.mode_groups, d.modes);
  renderRecords(d.records);
  renderDx(d.dx_ladder);
  renderMonths(d.by_month);
  renderYears(d.by_year);

  if(d.generated){
    var g = new Date(d.generated);
    if(!isNaN(g)) $('synced').textContent = 'Synced '+pad(g.getUTCHours())+':'
                                          + pad(g.getUTCMinutes())+' UTC';
  }
}

/* ------------------------------------------------------------------ fetch */
function load(){
  fetch(DATA_URL+'?v='+Date.now(), {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      failures = 0;
      $('stale').className = 'stale';
      // Rebuilding identical DOM restarts nothing visually, but it is wasted
      // work on a Pi that repaints every 10 minutes for no reason.
      var sig = JSON.stringify(d);
      if(sig !== lastSig){
        lastSig = sig;
        lastGood = d;
        render(d);
      }
    })
    .catch(function(){
      // Never wipe the display on a network error. A stale board beats a
      // blank one; the badge says which we are looking at.
      failures++;
      if(failures >= STALE_AFTER) $('stale').className = 'stale on';
      if(!lastGood && $('synced').textContent.trim() === '')
        $('synced').textContent = 'Waiting for data';
    });
}

/* ------------------------------------------------------- single master tick */
renderHeader();
load();
setInterval(function(){
  ticks++;
  renderHeader();
  if(ticks % Math.round(REFRESH_MS/TICK_MS) === 0) load();
}, TICK_MS);
</script>
</body>
</html>
