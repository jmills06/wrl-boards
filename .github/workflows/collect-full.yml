name: Collect full log

# Nightly, on GitHub's own cron.
#
# The 30-minute recent collector deliberately does NOT use `schedule:`, because
# GitHub queues scheduled runs and drops them under load, and a board that is
# meant to be half an hour old going four hours stale is the whole problem.
# That argument does not carry here. This run owns career.json and grids.json,
# which describe the entire log and move slowly; a nightly rebuild that lands
# twenty minutes late, or skips to the following night, costs nothing visible.
# Not worth a second external scheduler to avoid.
#
# Two things to know about `schedule:`. It only fires from the DEFAULT BRANCH,
# so this has no effect until it is on main. And GitHub disables scheduled
# workflows after 60 days without repository activity, which this repo cannot
# hit while the recent collector is committing every half hour.
on:
  schedule:
    # 08:17 UTC = 04:17 EDT / 03:17 EST. Deliberately off the hour: :00 is
    # GitHub's busiest scheduling slot and the one that slips worst. Also
    # lands between the recent collector's :00 and :30 runs, which share the
    # wrl-collect concurrency group with this one.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Write the board files even if validation objects, e.g. after a
          genuine mass deletion shrank the log by more than 10%.
        type: boolean
        default: false

# Both collectors write the same files. Never let them overlap.
concurrency:
  group: wrl-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: the push step rebases onto whatever landed while
          # this run was working, and a shallow clone cannot rebase.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          WRL_API_KEY: ${{ secrets.WRL_API_KEY }}
        run: |
          if [ -z "$WRL_API_KEY" ]; then
            echo "::error::WRL_API_KEY secret is not set on this repository."
            exit 1
          fi
          # On a scheduled run the `inputs` context is empty, so inputs.force
          # is null, the && short-circuits, and this expands to no flag at
          # all. Validation therefore still guards the nightly run; --force
          # only ever reaches it from a deliberate manual dispatch.
          python collect.py --mode=full ${{ inputs.force && '--force' || '' }}

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare the index: `git diff` alone reports
          # nothing for a file that is new rather than modified.
          git add data/latest
          if git diff --cached --quiet; then
            echo "No change in data/latest; nothing to commit."
            exit 0
          fi

          git commit -m "Update board data (full) [skip ci]"

          BRANCH="${GITHUB_REF_NAME}"
          # Another run may have pushed while this one was collecting. Rebase
          # onto it and retry rather than failing the run.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing and retrying."
            git pull --rebase --autostash -X theirs origin "${BRANCH}" || true
            sleep $((attempt * 3))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
