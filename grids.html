<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WRL Global Grid Map</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152333; --navy-d:#0d1620; --navy-l:#1e3347;
  --orange:#ff7030; --cream:#fdf8e5;
  --c80:rgba(253,248,229,.80); --c50:rgba(253,248,229,.50); --c30:rgba(253,248,229,.30);
  --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.10); --gold:#E0A52E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;height:100%}
#fit{position:absolute;top:0;left:0;transform-origin:top left}
#board{
  width:1080px;height:1920px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--navy-d) 0%,var(--navy) 45%,var(--navy-l) 100%);
  color:var(--cream);font-family:'Source Sans Pro',sans-serif;
  padding:36px 40px;display:flex;flex-direction:column;gap:20px;
}
#board::before,#board::after{
  content:'';position:absolute;width:620px;height:620px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,112,48,.13) 0%,rgba(255,112,48,0) 70%);
}
#board::before{top:-250px;left:-230px}
#board::after{bottom:-270px;right:-240px}
.z{position:relative;z-index:2}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--orange);padding-bottom:16px}
.call{font-family:'Oswald',sans-serif;font-weight:700;font-size:74px;line-height:.9}
.sub{font-family:'Oswald',sans-serif;font-weight:400;font-size:20px;letter-spacing:5px;text-transform:uppercase;color:var(--orange);margin-top:8px}
.hdr-r{text-align:right}
.hdr-r .t{font-family:'Oswald',sans-serif;font-size:46px;font-weight:300;line-height:1}
.hdr-r .d{font-size:17px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c50);margin-top:6px}

.sh{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.sh span{font-family:'Oswald',sans-serif;font-size:19px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--orange);white-space:nowrap}
.sh i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,112,48,.55),rgba(255,112,48,0))}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
.stat .n{font-family:'Oswald',sans-serif;font-weight:400;font-size:56px;line-height:1}
.stat .n small{font-size:24px;color:var(--c50);font-weight:300}
.stat .l{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c50);margin-top:6px}

.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px}
#map{width:100%;display:block}
.legend{display:flex;gap:30px;align-items:center;padding:8px 6px 2px;font-size:16px;color:var(--c80)}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}

.md{display:grid;grid-template-columns:54px 1fr 92px;align-items:center;gap:12px;margin-bottom:13px}
.md:last-child{margin-bottom:0}
.md .k{font-family:'Oswald',sans-serif;font-size:21px;color:var(--c80);text-align:right}
.md .tr{height:14px;background:rgba(255,255,255,.06);border-radius:7px;overflow:hidden}
.md .fl{height:100%;background:var(--orange);border-radius:7px}
.md .v{font-family:'Oswald',sans-serif;font-size:20px;color:var(--c80);text-align:right}
.md .v em{font-style:normal;font-size:13px;color:var(--c50);margin-left:3px}

.ng{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.ng:last-child{border-bottom:none;padding-bottom:0}
.ng .g{font-family:'Oswald',sans-serif;font-size:27px;font-weight:600;letter-spacing:1px;width:88px;color:var(--orange)}
.ng .p{flex:1;font-size:16px;color:var(--c50)}
.ng .p b{display:block;color:var(--c80);font-weight:400;font-size:19px;font-family:'Oswald',sans-serif;letter-spacing:.5px}
.ng .dt{font-family:'Oswald',sans-serif;font-size:18px;color:var(--c50);text-align:right}

.ftr{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  font-size:14px;letter-spacing:2.5px;text-transform:uppercase;color:var(--c30);
  border-top:1px solid var(--line);padding-top:14px}
/* ---- appended: stale indicator only. Nothing above this line is changed. ---- */
.ftr .stale{color:var(--orange);opacity:0;transition:opacity .4s}
.ftr .stale.on{opacity:1}
</style>
</head>
<body>
<div id="fit"><div id="board">

  <div class="hdr z">
    <div>
      <div class="call">K8JKU</div>
      <div class="sub">Grid squares worked</div>
    </div>
    <div class="hdr-r">
      <div class="t"><span id="clock">--:--</span><span style="font-size:22px;color:var(--c50)"> UTC</span></div>
      <div class="d" id="today">&nbsp;</div>
    </div>
  </div>

  <div class="stats z">
    <div class="stat"><div class="n" id="sGrids">&mdash;</div><div class="l">Grids</div></div>
    <div class="stat"><div class="n" id="sFields">&mdash;</div><div class="l">Fields</div></div>
    <div class="stat"><div class="n" id="sEnt">&mdash;</div><div class="l">Entities</div></div>
    <div class="stat"><div class="n" id="sNew">&mdash;</div><div class="l">New in 30 days</div></div>
  </div>

  <div class="mapwrap z">
    <svg id="map" viewBox="0 0 1000 660" role="img" aria-label="World map of grid squares worked"></svg>
    <div class="legend">
      <div><i style="background:rgba(253,248,229,.45)"></i>Worked</div>
      <div><i style="background:var(--orange)"></i>Last 30 days</div>
      <div><i style="background:var(--gold);border-radius:2px"></i>Home &middot; <span id="homeGrid">&mdash;</span></div>
    </div>
  </div>

  <div class="cols z">
    <div class="panel">
      <div class="sh"><span>Median distance</span><i></i></div>
      <div id="medians"></div>
    </div>
    <div class="panel">
      <div class="sh"><span>Newest grids</span><i></i></div>
      <div id="newest"></div>
    </div>
  </div>

  <div class="ftr z">
    <div id="ftrLeft">World Radio League</div>
    <div><span class="stale" id="stale">Stale &middot; </span><span id="synced">&nbsp;</span></div>
  </div>

</div></div>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
/* ------------------------------------------------------------------ tuning */
var AUTO_FIT   = true;    // scale the 1080x1920 board to fill the viewport
var ROTATE     = 0;       // 0 | 90 | 180 | 270. Use only when the browser's
                          // viewport orientation does not match the panel's
                          // physical orientation. Verified in Chromium:
                          // 90 puts the board's TOP EDGE on the RIGHT of the
                          // viewport, 270 puts it on the LEFT. If the display
                          // comes out upside down, use the other one.
var DATA_URL   = 'data/latest/grids.json';
var WORLD_URL  = 'vendor/countries-110m.json';
var TICK_MS    = 1000;             // master tick: clock + fetch scheduling
var REFRESH_MS = 10 * 60 * 1000;   // grid data changes nightly
var STALE_AFTER = 3;               // consecutive failures before the badge
var MAX_MEDIANS = 8;               // median-distance panel rows
var MAX_NEWEST  = 8;               // newest-grids panel rows

var PROJ_SCALE = 232, PROJ_X = 500, PROJ_Y = 340;
var DOT_R = 2.9, DOT_R_FRESH = 4;
var C_WORKED = 'rgba(253,248,229,0.45)', C_FRESH = '#ff7030', C_HOME = '#E0A52E';
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ------------------------------------------------------------------- fit */
function fit(){
  var f = document.getElementById('fit');
  if(!f) return;

  // Footprint after rotation: at 90/270 the board's width and height swap.
  var swap = (ROTATE === 90 || ROTATE === 270);
  var bw = swap ? 1920 : 1080;
  var bh = swap ? 1080 : 1920;

  var s = AUTO_FIT ? Math.min(innerWidth/bw, innerHeight/bh) : 1;

  // Centre on both axes. The old version only centred horizontally, which
  // left the board hugging the top of any viewport taller than the board.
  var left = (innerWidth  - bw*s)/2;
  var top  = (innerHeight - bh*s)/2;

  // Rotation happens about the top-left origin, so the board swings out of
  // view; translate it back by its own rotated footprint before centring.
  var tx = left, ty = top, rot = '';
  if(ROTATE === 90)       { tx += bw*s;             rot = ' rotate(90deg)'; }
  else if(ROTATE === 180) { tx += bw*s; ty += bh*s; rot = ' rotate(180deg)'; }
  else if(ROTATE === 270) {             ty += bh*s; rot = ' rotate(270deg)'; }

  f.style.left = '0';
  f.style.top  = '0';
  f.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+s+')'+rot;
}
addEventListener('resize', fit); fit();

/* --------------------------------------------------------------- helpers */
var SVGNS = 'http://www.w3.org/2000/svg';
function $(id){ return document.getElementById(id); }
function num(n){ return (n==null) ? '—' : n.toLocaleString('en-US'); }
function pad(n){ return (n<10?'0':'')+n; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function shortDate(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return '';
  return pad(+p[2])+' '+MONTHS[+p[1]-1];
}
function el(name, attrs){
  var n = document.createElementNS(SVGNS, name);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ----------------------------------------------------------------- state */
var proj = d3.geoNaturalEarth1().scale(PROJ_SCALE).translate([PROJ_X, PROJ_Y]);
var geoPath = d3.geoPath(proj);
var land = null;        // resolved once; the atlas is local and never changes
var lastSig = null;
var lastGood = null;
var failures = 0;
var ticks = 0;

/* --------------------------------------------------------------- rendering */
function renderHeader(){
  var d = new Date();
  $('clock').textContent = pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
  $('today').textContent = DAYS[d.getUTCDay()]+' '+pad(d.getUTCDate())+' '
                         + MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear();
}

function drawMap(d){
  var svg = $('map');
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  svg.appendChild(el('path', {d: geoPath({type:'Sphere'}),
    fill:'rgba(255,255,255,0.025)', stroke:'rgba(253,248,229,0.12)', 'stroke-width':1}));
  svg.appendChild(el('path', {d: geoPath(d3.geoGraticule10()),
    fill:'none', stroke:'rgba(253,248,229,0.06)', 'stroke-width':0.5}));

  if(land){
    svg.appendChild(el('path', {d: geoPath(land), fill:'rgba(253,248,229,0.10)',
      stroke:'rgba(253,248,229,0.22)', 'stroke-width':0.5}));
  }

  // Great-circle arcs: a two-point LineString through geoPath, so D3's
  // adaptive resampling bends it along the great circle for us.
  (d.arcs||[]).forEach(function(a){
    var p = geoPath({type:'LineString', coordinates:[a.from, a.to]});
    if(p) svg.appendChild(el('path', {d:p, fill:'none', stroke:C_FRESH,
                                      'stroke-width':1.2, opacity:0.45}));
  });

  // Fresh grids last, so a recent contact is never hidden under an old one.
  var pts = (d.points||[]).slice().sort(function(a,b){
    return (a.fresh?1:0) - (b.fresh?1:0);
  });
  pts.forEach(function(p){
    var c = proj([p.lon, p.lat]);
    if(!c || !isFinite(c[0]) || !isFinite(c[1])) return;
    svg.appendChild(el('circle', {cx:c[0], cy:c[1],
      r: p.fresh ? DOT_R_FRESH : DOT_R,
      fill: p.fresh ? C_FRESH : C_WORKED}));
  });

  if(d.home){
    var h = proj([d.home.lon, d.home.lat]);
    if(h && isFinite(h[0])){
      svg.appendChild(el('rect', {x:h[0]-5.5, y:h[1]-5.5, width:11, height:11,
        rx:2, fill:C_HOME, stroke:'#152333', 'stroke-width':1.5}));
    }
  }
}

function renderMedians(list){
  var top = (list||[]).slice(0, MAX_MEDIANS);
  var max = top.reduce(function(m,x){ return Math.max(m, x.miles); }, 0) || 1;
  $('medians').innerHTML = top.map(function(x){
    var w = Math.max(2, Math.round(100*x.miles/max));
    return '<div class="md"><div class="k">'+esc(x.band)+'</div>'
         + '<div class="tr"><div class="fl" style="width:'+w+'%"></div></div>'
         + '<div class="v">'+num(x.miles)+'<em>mi</em></div></div>';
  }).join('');
}

function renderNewest(list){
  $('newest').innerHTML = (list||[]).slice(0, MAX_NEWEST).map(function(g){
    return '<div class="ng"><div class="g">'+esc(g.grid)+'</div>'
         + '<div class="p"><b>'+esc(g.call)+'</b>'+esc(g.country||'')+'</div>'
         + '<div class="dt">'+shortDate(g.date)+'</div></div>';
  }).join('');
}

function render(d){
  $('sGrids').textContent = num(d.grid_count);
  $('sFields').innerHTML  = num(d.field_count)+'<small>/'+(d.field_total||324)+'</small>';
  $('sEnt').textContent   = num(d.dxcc_count);
  $('sNew').textContent   = num(d.new_30d);
  $('homeGrid').textContent = (d.home && d.home.grid) ? d.home.grid : '—';
  $('ftrLeft').textContent = 'World Radio League · '+num(d.grid_count)+' unique grids';

  drawMap(d);
  renderMedians(d.median_distance);
  renderNewest(d.newest_grids);

  if(d.generated){
    var g = new Date(d.generated);
    if(!isNaN(g)) $('synced').textContent = 'Synced '+pad(g.getUTCHours())+':'
                                          + pad(g.getUTCMinutes())+' UTC';
  }
}

/* ------------------------------------------------------------------ fetch */
function load(){
  fetch(DATA_URL+'?v='+Date.now(), {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      failures = 0;
      $('stale').className = 'stale';
      var sig = JSON.stringify(d);
      if(sig !== lastSig){
        lastSig = sig;
        lastGood = d;
        render(d);
      }
    })
    .catch(function(){
      // 736 dots that are one night old beat an empty map.
      failures++;
      if(failures >= STALE_AFTER) $('stale').className = 'stale on';
      if(!lastGood && $('synced').textContent.trim() === '')
        $('synced').textContent = 'Waiting for data';
    });
}

/* ------------------------------------------------------------------ start */
renderHeader();
// The land layer is local, so this resolves immediately; the board still
// renders points and arcs if it somehow does not.
fetch(WORLD_URL, {cache:'force-cache'})
  .then(function(r){ return r.json(); })
  .then(function(world){
    land = topojson.feature(world, world.objects.countries);
    if(lastGood) render(lastGood);
  })
  .catch(function(){})
  .then(load, load);

setInterval(function(){
  ticks++;
  renderHeader();
  if(ticks % Math.round(REFRESH_MS/TICK_MS) === 0) load();
}, TICK_MS);
</script>
</body>
</html>
